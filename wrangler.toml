# FAME SchoolApp authentication Worker configuration.
name = "fame-schoolapp"
main = "schoolapp.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Issuer / audience must match the FAME backend (SCHOOLAPP_ISSUER / SCHOOLAPP_AUDIENCE).
SCHOOLAPP_ISSUER = "fame-schoolapp"
SCHOOLAPP_AUDIENCE = "fame-api"
# Optional override for the SchoolApp base URL. Leave empty to use the library
# default (https://schoolapp.ensam-umi.ac.ma).
SCHOOLAPP_API_URL = ""
# CORS origin for the FAME frontend.
ALLOWED_ORIGIN = "*"

# The Ed25519 private signing key (base64url, 32-byte seed) is stored as a
# Cloudflare SECRET, never in this file:
#
#   npx wrangler secret put SCHOOLAPP_PRIVATE_KEY
#
# Generate it with: cd backend && uv run python ../scripts/generate_keys.py
# The matching PUBLIC key goes into the backend .env as SCHOOLAPP_PUBLIC_KEY.

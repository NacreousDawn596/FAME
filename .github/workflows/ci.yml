name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Backend unit tests (unit only)
        working-directory: services/api
        run: ./gradlew --no-daemon test --tests 'ma.ensam.fame.security.*' --tests 'ma.ensam.fame.service.QueueStateMachineTest' --tests 'ma.ensam.fame.service.AnalyticsServiceTest'
      - name: Backend integration tests (Testcontainers)
        working-directory: services/api
        run: ./gradlew --no-daemon test --tests 'ma.ensam.fame.service.QueueEngineIntegrationTest'
      - name: Backend build
        working-directory: services/api
        run: ./gradlew --no-daemon bootJar

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Typecheck + lint
        working-directory: apps/web
        run: npm run lint
      - name: Tests
        working-directory: apps/web
        run: npm test
      - name: Build
        working-directory: apps/web
        run: npm run build

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: workers/schoolapp-auth
        run: npm ci --no-audit --no-fund
      - name: Tests
        working-directory: workers/schoolapp-auth
        run: npm test

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Backend dependency check (OWASP)
        working-directory: services/api
        run: ./gradlew --no-daemon dependencyCheckAnalyze --failOnCVSS 11
      - name: npm audit (web)
        working-directory: apps/web
        run: npm audit --audit-level=high
      - name: npm audit (worker)
        working-directory: workers/schoolapp-auth
        run: npm audit --audit-level=high
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

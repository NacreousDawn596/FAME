name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fame_test
          POSTGRES_USER: fame
          POSTGRES_PASSWORD: fame
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fame -d fame_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql+asyncpg://fame:fame@localhost:5432/fame_test
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install dependencies
        working-directory: backend
        run: uv sync --extra dev
      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check .
      - name: Tests (pytest, PostgreSQL réel)
        working-directory: backend
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fame-react/package-lock.json
      - name: Install
        working-directory: fame-react
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: fame-react
        run: npm run typecheck
      - name: Build
        working-directory: fame-react
        run: npm run build

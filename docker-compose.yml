name: fame

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fame}
      POSTGRES_USER: ${POSTGRES_USER:-fame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fame}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fame}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build:
      context: ./services/api
    # Backend is configured exclusively via config.yml (mounted below).
    # Copy config.yml.example -> config.yml and adjust (datasource, Redis,
    # worker, VAPID, superadmin, CORS). No env-var overrides here, so the
    # mounted file is the single source of truth.
    volumes:
      - ./config.yml:/app/config.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [internal]

  web:
    build:
      context: ./apps/web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  redisdata:

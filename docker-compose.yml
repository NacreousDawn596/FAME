# FAME — shared compose template.
# A single template drives N isolated stacks. The deploy script supplies a
# generated per-instance env file via `docker compose --env-file <file>` and a
# distinct project name via `-p <name>` (project name isolates containers,
# volumes and networks). Do not hardcode `name:` here.

x-common-env: &common-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://fame:change-me-postgres@postgres:5432/fame}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  SESSION_SECRET: ${SESSION_SECRET:-}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
  SCHOOLAPP_WORKER_URL: ${SCHOOLAPP_WORKER_URL:-}
  SCHOOLAPP_PUBLIC_KEY: ${SCHOOLAPP_PUBLIC_KEY:-}
  SCHOOLAPP_ISSUER: ${SCHOOLAPP_ISSUER:-fame-schoolapp}
  SCHOOLAPP_AUDIENCE: ${SCHOOLAPP_AUDIENCE:-fame-api}
  ORGANIZER_INITIAL_EMAILS: ${ORGANIZER_INITIAL_EMAILS:-}
  ORGANIZER_INITIAL_PASSWORD: ${ORGANIZER_INITIAL_PASSWORD:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:fame@gadzarts.xyz}
  NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-fame@gadzarts.xyz}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5483}
  API_URL: ${API_URL:-http://localhost:5483}
  DEFAULT_COMPANY_NAME: ${DEFAULT_COMPANY_NAME:-FAME Recruitment}
  REGULATORS: ${REGULATORS:-}
  ROOMS: ${ROOMS:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fame}
      POSTGRES_USER: ${POSTGRES_USER:-fame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fame} -d ${POSTGRES_DB:-fame}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fame
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fame
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fame
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    command: ["arq", "app.workers.notifications.WorkerSettings"]
    environment:
      <<: *common-env
      WHATSAPP_BRIDGE_URL: ${WHATSAPP_BRIDGE_URL:-http://host.docker.internal:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fame
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - fame
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    ports:
      - "${PORT:-5483}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - fame
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  postgres_data:
  redis_data:

networks:
  fame:
    driver: bridge

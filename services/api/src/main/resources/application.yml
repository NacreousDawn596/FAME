spring:
  application:
    name: fame-api
  # External operator configuration. `optional:` lets the app boot without it
  # (tests / local dev); when present it overrides the defaults below.
  config:
    import: optional:file:./config.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fame}
    username: ${DB_USERNAME:fame}
    password: ${DB_PASSWORD:fame}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  session:
    store-type: redis
    timeout: 12h
    redis:
      repository-type: indexed
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${FAME_COOKIE_SECURE:false}
        same-site: lax
        name: FAMESESSION
  tomcat:
    max-http-form-post-size: 1MB

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    redis:
      enabled: true

# Defaults (overridden by config.yml when present). Env-var fallbacks keep the
# app bootable in tests and local development.
fame:
  admin:
    email: ${FAME_ADMIN_EMAIL:}
    password: ${FAME_ADMIN_PASSWORD:}
  worker:
    public-key: ${FAME_WORKER_PUBLIC_KEY:}
    issuer: ${FAME_WORKER_ISSUER:https://schoolapp-auth.gadzarts.xyz}
    audience: ${FAME_WORKER_AUDIENCE:fame-api}
    assertion-ttl: 90s
  vapid:
    public-key: ${FAME_VAPID_PUBLIC_KEY:}
    private-key: ${FAME_VAPID_PRIVATE_KEY:}
    subject: ${FAME_VAPID_SUBJECT:mailto:ops@example.com}
  cors:
    origins: ${FAME_CORS_ORIGINS:http://localhost:5173}
  security:
    session-secret: ${FAME_SESSION_SECRET:}
  bootstrap:
    admin-username: ${FAME_ADMIN_USERNAME:admin}
    admin-password: ${FAME_ADMIN_PASSWORD:}
    admin-display-name: ${FAME_ADMIN_DISPLAY_NAME:Administrateur}
